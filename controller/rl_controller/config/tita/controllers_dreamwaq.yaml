# This config file is used by ros2_control
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      tita_rl_controller:
        type: rl_controller/RlController

  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 500  # Hz
      sensor_name: trunk_imu
      frame_id: trunk_imu
  joint_state_broadcaster:
    ros__parameters:
      update_rate: 500  # Hz

  tita_rl_controller:
    ros__parameters:
      update_rate: 500  # Hz
      joints:
        - joint_left_leg_1
        - joint_left_leg_2
        - joint_left_leg_3
        - joint_left_leg_4
        - joint_right_leg_1
        - joint_right_leg_2
        - joint_right_leg_3
        - joint_right_leg_4
      command_interfaces:
        - position
        - velocity
        - effort
        - kp
        - kd
      state_interfaces:
        - position
        - velocity
        - effort
      sensors:
        - trunk_imu

      torque_limit: [60.0, 60.0, 60.0, 20.0, 60.0, 60.0, 60.0, 20.0]
      wheel_indices: [3, 7]
      hip_indices: [0, 4]

      transform_up:
        fold_jpos: [0.75, 1.20, -2.7, 0.0, -0.75, 1.2, -2.7, 0.0]
        stand_jpos: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.90, -2.6, 0.0]
        fold_timer: 4.0
        stand_timer: 2.0
        ff_torque: [-20.0, 0.0, -25.0, 0.0, 20.0, 0.0, -25.0, 0.0]
        joint_kp: [600.0, 80.0, 80.0, 5.0, 600.0, 80.0, 80.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.5, 8.0, 8.0, 8.0, 0.5]

      transform_down:
        fold_jpos: [0.5, 1.20, -2.7, 0.0, -0.5, 1.2, -2.7, 0.0]
        fold_timer: 4.0
        joint_kp: [600.0, 80.0, 80.0, 5.0, 600.0, 80.0, 80.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.2, 8.0, 8.0, 8.0, 0.2]

      joint_pd:
        joint_kp: [600.0, 80.0, 80.0, 5.0, 600.0, 80.0, 80.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.2, 8.0, 8.0, 8.0, 0.2]

      rl_policy_names:
        - "rl_dreamwaq"

      rl_dreamwaq:
        policy_type: "dreamwaq"
        policy_path: config/tita/dreamwaqOnnx/cenet_actor.onnx
        output_name: "actions"

        use_velocity_estimator: false
        estimator_policy_path: ""
        estimator_output_name: "estimated_velocity"
        estimator_history_len: 3

        dreamwaq_encoder_policy_path: config/tita/dreamwaqOnnx/cenet_encoder.onnx
        dreamwaq_encoder_output_name: "encoder_feature"
        dreamwaq_vel_mu_policy_path: config/tita/dreamwaqOnnx/cenet_vel_mu.onnx
        dreamwaq_vel_mu_output_name: "estimated_velocity"
        dreamwaq_latent_mu_policy_path: config/tita/dreamwaqOnnx/cenet_latent_mu.onnx
        dreamwaq_latent_mu_output_name: "latent_mean"
        dreamwaq_encoder_feature_dim: 64
        dreamwaq_velocity_dim: 3
        dreamwaq_latent_dim: 16

        num_obs: 31
        num_actions: 8
        history_len: 5
        observations_history_mode: "term"
        observations_name: ["ang_vel", "gravity", "commands", "dof_pos_nwp", "dof_vel", "last_actions"]
        observations_dims: [3, 3, 3, 6, 8, 8]
        commands_name: ["lin_vel_x", "lin_vel_y", "ang_vel_z"]
        commands_scale: [2.0, 2.0, 0.25]
        max_commands: [1.0, 0.0, 1.0]
        min_commands: [-1.0, -0.0, -1.0]
        commands_comp: [0.0, 0.0, 0.0]
        heading_hold_enabled: true
        heading_hold_stiffness: 0.5
        heading_hold_yaw_input_threshold: 0.001
        csv_logging_enabled: false

        time_interval: 0.02
        wheel_torque_mode: "velocity_ff"
        default_joint_angles: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
        joint_kp: [40.0, 40.0, 40.0, 12.0, 40.0, 40.0, 40.0, 12.0]
        joint_kd: [1.0, 1.0, 1.0, 0.5, 1.0, 1.0, 1.0, 0.5]
        action_scales: [0.25, 0.5, 0.5, 0.5, 0.25, 0.5, 0.5, 0.5]

        lin_vel_scale: 2.0
        ang_vel_scale: 0.25
        dof_pos_scale: 1.0
        dof_vel_scale: 0.05

        observation_reindex: [0, 4, 1, 5, 2, 6, 3, 7]
